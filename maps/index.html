<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>House maps · James Wild & Co.</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="/maps/vendor/maplibre-gl.css"><link rel="stylesheet" href="/maps/jw-maps.css">
<style>body{margin:0;background:#F4EFE4;color:#1E2A30;font:16px/1.5 Inter,system-ui,sans-serif}main{max-width:1100px;margin:0 auto;padding:24px 16px}h1,h2{font-family:"Cormorant Garamond",Georgia,serif;font-weight:500}section{margin:0 0 48px}</style>
</head><body><main class="jw-maps">
<h1>House maps: working example</h1>
<section><h2>Voyage · Cruise A, The Old South</h2>
<div class="jw-frame chart"><div class="jw-map" id="voy"></div></div><div class="jw-days" id="voy-days"></div>
<details><summary>The itinerary in words</summary><div id="voy-text"></div></details></section>
<section><h2>Overland · The Maya road</h2>
<div class="jw-frame survey"><div class="jw-map" id="land"></div></div><div class="jw-days" id="land-days"></div></section>
</main>
<script src="/maps/vendor/maplibre-gl.js"></script><script src="/maps/jw-maps.js"></script>
<script>
JWMaps.config({ base: "/maps/data/" });
function load(id){ return fetch("/maps/routes/" + id + ".json").then(function(r){ return r.json(); }); }
load("cruise-a-the-old-south").then(function(route){
  JWMaps.itinerary("voy", route, { daysEl: document.getElementById("voy-days") });
  document.getElementById("voy-text").innerHTML = JWMaps.itineraryHTML(route);
  var s = document.createElement("script"); s.type = "application/ld+json";
  s.textContent = JSON.stringify(JWMaps.jsonLD(route, location.href)); document.head.appendChild(s);
});
load("the-maya-road").then(function(route){ JWMaps.itinerary("land", route, { daysEl: document.getElementById("land-days") }); });
</script></body></html>
